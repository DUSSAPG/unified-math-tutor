  <rect width="640" height="260" rx="28" fill="#0B1120"/>
  <g font-family="DMSans, Arial, sans-serif" text-anchor="middle">
    <line x1="90" y1="170" x2="560" y2="170" stroke="#1F3055" stroke-width="2"/>
    <path d="M140,50 Q320,440 500,50" fill="none" stroke="#5B8EFF" stroke-width="3.5"/>
    <circle cx="208" cy="170" r="6" fill="#FFBD00"/>
    <circle cx="432" cy="170" r="6" fill="#FFBD00"/>
    <text x="208" y="196" fill="#FFBD00" font-size="16" font-weight="700">x₁</text>
    <text x="432" y="196" fill="#FFBD00" font-size="16" font-weight="700">x₂</text>
    <circle cx="320" cy="245" r="5" fill="#34C759"/>
