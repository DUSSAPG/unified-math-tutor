name: unified_math_tutor
description: Unified Math Tutor (multi-market shell)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.2

  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  lucide_icons: any
  fl_chart: ^1.1.1
  flutter_math_fork: ^0.7.4
  flutter_svg: ^2.2.3
  pdf: ^3.11.3
  printing: ^5.14.2

  flutter_shared_models:
    path: ../../../packages/flutter_shared_models

  flutter_shared_ui:
    path: ../../../packages/flutter_shared_ui

  coachsuite_exam_engine:
    path: ../../../packages/coachsuite_exam_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/pack_registry.json
    - assets/market_registry.json
    - assets/packs/en-GB/
    - assets/packs/de-CH/
    - assets/packs/fr-CH/
    - assets/packs/it-CH/
    - assets/config/
    - assets/config/mental_math_tricks.json
    - assets/config/daily_brain_teasers.json
    - assets/config/daily_brain_teasers.fr-CH.json
    - assets/config/daily_brain_teasers.de-CH.json
    - assets/config/daily_brain_teasers.it-CH.json
    - assets/icons/
    - assets/splash/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf

    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
          weight: 400

# ─── Launcher Icons ───────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B1120"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# ─── Native Splash ────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#0B1120"
  image: assets/splash/splash_logo.png
  android: true
  ios: false
  android_12:
    color: "#0B1120"
    image: assets/splash/splash_logo.png
