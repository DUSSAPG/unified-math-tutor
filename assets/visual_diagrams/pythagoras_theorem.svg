<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Right-angled triangle with the two shorter sides a and b and the hypotenuse c labelled">
  <rect width="640" height="260" rx="28" fill="#0B1120"/>
  <g font-family="DMSans, Arial, sans-serif" text-anchor="middle">
    <polygon points="200,210 440,210 200,70" fill="#5B8EFF" fill-opacity="0.18" stroke="#5B8EFF" stroke-width="3"/>
    <rect x="200" y="196" width="14" height="14" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="320" y="232" fill="#34C759" font-size="18" font-weight="700">a</text>
    <text x="176" y="145" fill="#34C759" font-size="18" font-weight="700">b</text>
    <text x="340" y="130" fill="#FFBD00" font-size="18" font-weight="700">c (hypotenuse)</text>
    <text x="320" y="30" fill="#FFFFFF" font-size="20" font-weight="700">a² + b² = c²</text>
  </g>
</svg>
