<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Cylinder with radius r on the top face and height h between the two circular faces labelled">
  <rect width="640" height="260" rx="28" fill="#0B1120"/>
  <g font-family="DMSans, Arial, sans-serif" text-anchor="middle">
    <line x1="220" y1="80" x2="220" y2="200" stroke="#5B8EFF" stroke-width="3"/>
    <line x1="420" y1="80" x2="420" y2="200" stroke="#5B8EFF" stroke-width="3"/>
    <ellipse cx="320" cy="200" rx="100" ry="26" fill="#5B8EFF" fill-opacity="0.12" stroke="#5B8EFF" stroke-width="3"/>
    <ellipse cx="320" cy="80" rx="100" ry="26" fill="#5B8EFF" fill-opacity="0.22" stroke="#5B8EFF" stroke-width="3"/>
    <line x1="320" y1="80" x2="420" y2="80" stroke="#FFBD00" stroke-width="2.5"/>
    <text x="372" y="68" fill="#FFBD00" font-size="18" font-weight="700">r</text>
    <line x1="470" y1="80" x2="470" y2="200" stroke="#34C759" stroke-width="2.5" stroke-dasharray="6 6"/>
    <line x1="460" y1="80" x2="480" y2="80" stroke="#34C759" stroke-width="2.5"/>
    <line x1="460" y1="200" x2="480" y2="200" stroke="#34C759" stroke-width="2.5"/>
    <text x="500" y="145" fill="#34C759" font-size="18" font-weight="700">h</text>
    <text x="320" y="30" fill="#FFFFFF" font-size="20" font-weight="700">V = π × r² × h</text>
  </g>
</svg>
